# Oyunu iPhone uygulamasına (.ipa) çevirir. Her push'ta GitHub'ın Mac'lerinde çalışır.
# Sonuç: https://github.com/<kullanıcı>/piksel-arena/releases/latest/download/PikselArena.ipa
# Sideloadly ile ücretsiz Apple hesabıyla yüklenir.
name: iPhone uygulaması

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capacitor kur ve iOS projesi oluştur
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap add ios
          npx cap sync ios

      - name: Uygulama simgesi
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do
            sips -s format png -z 1024 1024 public/icon-512.png --out "$f" > /dev/null
          done
          ls "$ICONSET"

      - name: Derle (imzasız)
        shell: bash
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -20

      - name: .ipa paketle
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Uygulama: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PikselArena.ipa Payload
          ls -la PikselArena.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iPhone uygulaması ${{ github.run_number }}
          files: PikselArena.ipa
          make_latest: true
